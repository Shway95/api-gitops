replicaCount: 2

image:
  repository: "shwetang95/employee-api"
  pullPolicy: IfNotPresent
  tag: "a33be17"

nameOverride: ""
fullnameOverride: "employee-api"

serviceAccount:
  create: true
  name: "employee-api-sa"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: employee-api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

env:
  DB_HOST: "10.0.10.97"
  DB_PORT: "5432"
  DB_NAME: "employeedb"
  SERVER_PORT: "8080"

secrets:
  DB_USERNAME: "dbadmin"
  DB_PASSWORD: ")ge14wlvepa^yZhM1LH36)pu"

# External Secrets Operator is installed on the cluster.
# In production, enable this to pull credentials directly from AWS Secrets Manager
# instead of storing them in Git. The secret "employee-api-dev-db-credentials"
# in AWS Secrets Manager is the source of truth with 30-day auto-rotation.
externalSecrets:
  enabled: false
  region: "us-east-1"
  secretName: "employee-api-dev-db-credentials"

postgresql:
  enabled: true
  auth:
    postgresPassword: "postgres"
    database: "employeedb"
  primary:
    persistence:
      enabled: true
      size: 5Gi

namespace: employee-api
